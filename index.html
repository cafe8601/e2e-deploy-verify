<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEAS E2E Deploy Verify</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; line-height: 1.6; color: #1a1a2e; }
    h1 { color: #16213e; }
    .badge { display: inline-block; background: #0f3460; color: #fff; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.85rem; }
    .ok { color: #2d6a4f; font-weight: 600; }
    code { background: #f0f0f5; padding: 0.1rem 0.4rem; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>SEAS E2E Deploy Verify <span class="badge" id="ver">v1.0.0</span></h1>
  <p class="ok" id="status">✅ GitHub Pages 배포 성공 — 실제 공개 URL 서빙 중</p>
  <p>이 페이지는 SEAS <code>enterprise-production</code> 라이프사이클의
     <strong>실제 외부 배포 end-to-end</strong> 검증 산출물입니다.</p>
  <ul>
    <li>ship: 실제 PR 생성 → CI → merge</li>
    <li>launch: GitHub Pages 공개 배포</li>
    <li>canary: 공개 URL 헬스 모니터링</li>
  </ul>
  <p>배포 시각: <span id="ts">—</span></p>
  <script>
    // 콘솔 에러 0 보장 + 헬스 마커 렌더
    document.getElementById('ts').textContent = new Date().toISOString();
    console.log('[health] SEAS e2e-deploy-verify rendered OK');
  </script>
</body>
</html>
